server:
  port: 8081
  servlet:
    context-path: /codeanalyzer/server

spring:
  datasource:
    # Standalone demo DB. In Analyzer, replace with your PostgreSQL datasource.
    url: jdbc:h2:mem:subsystem_discovery;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

subsystem:
  llm:
    enabled: true

    openrouter-api-key: ${OPENROUTER_API_KEY:}

    openrouter-url: https://openrouter.ai/api/v1/chat/completions

    gemini-api-key: ${GEMINI_API_KEY:}

    max-tokens: 4000

    temperature: 0.7

    connect-timeout-ms: 10000

    read-timeout-ms: 180000

boundary:
  analysis:
    min-cross-edges: 1
    min-cross-weight: 0.0
    min-boundary-score: 0.0
    medium-coupling-weight-threshold: 8.0
    medium-coupling-edge-threshold: 4
    high-coupling-weight-threshold: 20.0
    high-coupling-edge-threshold: 10
    default-top-node-limit: 25
    default-hotspot-limit: 20
